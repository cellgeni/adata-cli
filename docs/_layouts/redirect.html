<!DOCTYPE html>
<html lang="en-US">
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ page.redirect.to }}">
  <meta name="robots" content="noindex">
  <script>
    // jekyll-redirect-from's own page drops the #anchor, so a link into the
    // middle of an old page landed at the top of the new one. Keep it, and
    // send the anchors of the old one-page command reference to the pages
    // their sections moved to.
    (function () {
      var to = "{{ page.redirect.to }}";
      var hash = location.hash;
      var moved = {
        "#10x-genomics-hdf5": "reference/formats/10x-h5/",
        "#cellbender": "reference/formats/cellbender/",
        "#10x-genomics-and-starsolo-mtx-folders": "reference/formats/10x-mtx/",
        "#parse-biosciences-split-pipe": "reference/formats/parse/",
        "#loom": "reference/formats/loom/",
        "#scope-looms": "reference/formats/loom/#scope-looms",
        "#writing-scope-looms": "reference/formats/loom/#writing-scope-looms",
        "#text-tables": "reference/formats/text/",
        "#hdf5-matrices": "reference/formats/hdf5/",
        "#pycistopic-pickles": "reference/formats/cistopic/",
        "#mudata": "reference/formats/mudata/",
        "#query-expressions": "reference/query/"
      };
      if (/\/COMMANDS(\.html)?$/.test(location.pathname) && moved[hash]) {
        location.replace("{{ site.url }}{{ site.baseurl }}/" + moved[hash]);
      } else {
        location.replace(to + hash);
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
  <h1>Redirecting&hellip;</h1>
  <a href="{{ page.redirect.to }}">Click here if you are not redirected.</a>
</html>
