[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --timeout=300 --timeout-method=thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    perf: cost guards (test_performance.py, and a few beside their code); CI runs them as a job of their own
    integration: builds environments with uv and needs the network on first run
