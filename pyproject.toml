[project]
# The short name `adata-cli` was taken on PyPI by an unrelated project,
# so the distribution is published as `pyadata-cli`. The import package
# and the command are both still `adata`.
name = "pyadata-cli"
version = "0.17.3"
description = "Streaming CLI for exploring and editing large AnnData .h5ad and .zarr stores"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aljes Binkevich", email = "ab76@sanger.ac.uk" },
]
maintainers = [
    { name = "Aljes Binkevich", email = "ab76@sanger.ac.uk" },
]
keywords = [
    "anndata",
    "h5ad",
    "zarr",
    "bioinformatics",
    "single-cell",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Every module src/adata imports is declared, here or in an extra, rather
# than left to arrive with another package. CI's floors job installs each
# floor and runs the unit suite on it. The caps keep out the next major of
# the libraries whose API the code is written against. typer is still 0.x
# and can break in a minor (0.26 stopped installing click), but a cap at the
# next minor would turn away each new typer until we release, so it is 1.0.
dependencies = [
    "h5py>=3.15.1,<4",
    # Zarr v2 compressors (storage/__init__.py).
    "numcodecs>=0.14",
    "numpy>=2.3.5,<3",
    # 13.0.0 fixes the decoder advisories that reach `import image` and the
    # Visium and Xenium tissue images.
    "pillow>=13.0.0",
    "rich>=14.2.0",
    "typer>=0.20.0,<1",
    # 3.2.0 reads both spellings of a v3 record dtype (scanpy's
    # rank_genes_groups); 3.1 cannot open a store newer zarr wrote with one.
    "zarr>=3.2.0,<4",
]

[project.urls]
Homepage = "https://github.com/cellgeni/adata-cli"
Repository = "https://github.com/cellgeni/adata-cli"
Documentation = "https://cellgeni.github.io/adata-cli/"
Issues = "https://github.com/cellgeni/adata-cli/issues"
Changelog = "https://cellgeni.github.io/adata-cli/changelog/"

[project.optional-dependencies]
# Reading pycisTopic's pickles: pandas and scipy rebuild their tables and
# matrices. Imported only on that converter's path.
pickle = [
    # pandas 2.2.3 is what tests/test_external_readers.py converts a pickle
    # under (the floors job runs dev's pandas 3); 2.2.0 and 2.2.1 predate
    # numpy 2. scipy before 1.15 caps numpy below 2.3.
    "pandas>=2.2.3",
    "scipy>=1.15",
]
# Reading Visium HD: its bin positions are Parquet only. Imported only by
# the Visium converter, and only for an HD input. 18 is the first with
# wheels for Python 3.13.
spatial = [
    "pyarrow>=18",
]
dev = [
    # pandas 3, not the pickle extra's 2.2.3: anndata writes nullable strings
    # only where pandas infers them, and the test fixtures rely on that.
    "pandas>=3.0",
    "scipy>=1.15",
    "pyarrow>=18",
    # The oracle for the centroids and areas of segmented cells
    # (tests/test_geojson.py). Older releases fail on numpy 2.3.
    "shapely>=2.0.6",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    # Turns a hang into a failure with a traceback. Without it a stuck test
    # burns the CI job's whole timeout and reports nothing useful.
    "pytest-timeout>=2.3.1",
    # Used only by tests/test_anndata_roundtrip.py, to check that what this
    # tool reads and writes matches what anndata itself produces.
    "anndata>=0.13",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "adata"


[project.scripts]
adata = "adata.cli:main"
# Deprecated alias, removed in 1.0.0
h5ad = "adata.cli:main_deprecated"

[tool.coverage.run]
source = ["src/adata"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
