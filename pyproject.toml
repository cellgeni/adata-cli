[project]
name = "adata-cli"
version = "0.4.0.dev0"
description = "Streaming CLI for exploring and editing large AnnData .h5ad and .zarr stores"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Aljes Binkevich", email = "ab76@sanger.ac.uk" },
]
maintainers = [
    { name = "Aljes Binkevich", email = "ab76@sanger.ac.uk" },
]
keywords = [
    "anndata",
    "h5ad",
    "bioinformatics",
    "single-cell",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "h5py>=3.15.1",
    "numpy>=2.3.5",
    "pillow>=12.1.0",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "zarr>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/cellgeni/h5ad-cli"
Repository = "https://github.com/cellgeni/h5ad-cli"
Documentation = "README.md"
Issues = "https://github.com/cellgeni/h5ad-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    # Used only by tests/test_anndata_roundtrip.py, to check that what this
    # tool reads and writes matches what anndata itself produces.
    "anndata>=0.13",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "adata"

[project.scripts]
adata = "adata.cli:main"
# Deprecated alias, removed in 1.0.0
h5ad = "adata.cli:main_deprecated"

[tool.coverage.run]
source = ["src/adata"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
