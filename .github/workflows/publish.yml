name: Publish

# Tags are bare MAJOR.MINOR.PATCH, matching the existing convention.
#
# What a run publishes, by how it started:
#
#   a pushed tag                            PyPI, then the image
#   workflow_dispatch, target testpypi      TestPyPI only, from any ref
#   workflow_dispatch, target pypi          PyPI, then the image; from a tag
#                                           only, as check-version runs for
#                                           tags alone
#
# Nothing publishes unless the suite passed, and nothing reaches PyPI or
# quay.io unless the tag matches pyproject.toml.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

# None by default: the repository's default token can write, and a job that
# names no permissions gets that. Each job below asks for what it uses.
permissions: {}

jobs:
  # The tag must match the version in pyproject.toml. Nothing enforced this
  # before, and 0.3.2 was tagged against a tree declaring 0.3.1.
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag must match the declared version
        id: version
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME}"
          echo "pyproject: $declared, tag: $tag"
          if [ "$declared" != "$tag" ]; then
            echo "::error::Tag $tag does not match pyproject version $declared"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/tests.yml
    # A called workflow gets no more than its caller grants, and the unit
    # job in tests.yml writes a check run and comments on pull requests.
    permissions:
      contents: read
      checks: write
      pull-requests: write

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing; no API token secret needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Both must succeed: a job whose need was skipped is skipped too, so a
    # dispatch from a branch, where check-version does not run, publishes
    # nothing. The event test is what keeps a TestPyPI dispatch from a tag
    # off PyPI; up to 0.17.4 any run from a tag published here.
    needs: [build, check-version]
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # The image moves :latest, so it goes out only once PyPI has the release:
  # after the suite, the version check and the upload have all passed.
  image:
    needs: [check-version, publish-pypi]
    permissions:
      contents: read
    uses: ./.github/workflows/quay-on-tag.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
