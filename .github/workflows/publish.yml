name: Publish

# Tags are bare MAJOR.MINOR.PATCH, matching the existing convention.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  # The tag must match the version in pyproject.toml. Nothing enforced this
  # before, and 0.3.2 was tagged against a tree declaring 0.3.1.
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the declared version
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME}"
          echo "pyproject: $declared, tag: $tag"
          if [ "$declared" != "$tag" ]; then
            echo "::error::Tag $tag does not match pyproject version $declared"
            exit 1
          fi
      # The GitHub release's notes are this section, so check it before
      # anything is published rather than after.
      - name: The changelog must have a section for the tag
        run: |
          if ! grep -qxF "## ${GITHUB_REF_NAME}" docs/changelog.md; then
            echo "::error::docs/changelog.md has no '## ${GITHUB_REF_NAME}' section"
            exit 1
          fi

  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [test]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: [build]
    if: |
      always()
      && needs.build.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing; no API token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, check-version]
    # check-version only runs for tags, and GitHub skips a job whose
    # dependency was skipped -- so without always() a manual dispatch to PyPI
    # would never publish. Success of build is therefore asserted explicitly,
    # and check-version is accepted as either passed or not applicable.
    if: |
      always()
      && needs.build.result == 'success'
      && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Releases were cut by hand with `gh release create` until 0.11.1. The
  # checklist never named that step, so 0.12.0 to 0.17.3 were tagged and
  # published with no release page, and backfilled later. Running after PyPI
  # means a release page never announces a version pip cannot install.
  github-release:
    needs: [publish-pypi]
    if: |
      always()
      && needs.publish-pypi.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" \
            '$0 == "## " tag { on = 1; next } on && /^## / { exit } on' \
            docs/changelog.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One cut by hand first is left alone.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
