name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Reused by publish.yml, so a release cannot skip the suite.
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write   # needed for EnricoMi/publish-unit-test-result-action on PRs

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: tests (py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Prefer an action over curl|sh
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      - name: Run tests with coverage
        run: |
          uv run pytest -v -W default tests/ \
            --cov=adata \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=pytest-results-py${{ matrix.python-version }}.xml

      - name: Publish test results summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-results-py${{ matrix.python-version }}.xml
          check_name: Test Results (py${{ matrix.python-version }})

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            pytest-results-py${{ matrix.python-version }}.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
