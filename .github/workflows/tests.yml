name: Tests

on:
  push:
    branches: [main, dev]
  # Every pull request, not only those targeting main/dev -- a stacked PR
  # based on another feature branch would otherwise run no checks at all.
  pull_request:
  # Reused by publish.yml, so a release cannot skip the suite.
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise: the repository's default token can
# write.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write          # publish-unit-test-result-action writes a check run
      pull-requests: write   # ...and comments the summary on the PR

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    name: tests (py${{ matrix.python-version }})

    env:
      # uv takes its interpreter from .python-version (3.12, for local work)
      # before the one setup-python puts on PATH, so up to 0.17.4 the py3.13
      # leg ran the suite on 3.12. UV_PYTHON outranks the file.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # Prefer an action over curl|sh. Every workflow names the same uv, so a
      # release builds and publishes with the uv this suite ran on.
      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      # The leg's name is a claim; this checks it before anything runs.
      - name: The suite runs on the Python this leg names
        run: |
          uv run --frozen python --version
          actual=$(uv run --frozen python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$actual" != "$UV_PYTHON" ]; then
            echo "::error::the py$UV_PYTHON leg would run the suite on Python $actual"
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          uv run pytest -v -W default tests/ -m "not integration" \
            --cov=adata \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=90 \
            --junitxml="pytest-results-py$UV_PYTHON.xml"

      - name: Publish test results summary
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: pytest-results-py${{ matrix.python-version }}.xml
          check_name: Test Results (py${{ matrix.python-version }})

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            pytest-results-py${{ matrix.python-version }}.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # What `pip install pyadata-cli` gets today, not what uv.lock pins. 0.7.0
  # to 0.17.2 imported click, which typer had stopped installing in 0.26, so
  # every `adata convert` on a fresh install crashed while the locked suite
  # stayed green. This installs the base package alone from a fresh
  # resolution, imports every module on the base dependencies alone, and
  # runs `convert`.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: fresh install, no lock

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install the base package from a fresh resolution
        run: |
          uv venv --python 3.13 fresh
          uv pip install --python fresh/bin/python .
          uv pip list --python fresh/bin/python

      - name: Every module imports, and none pulls in an optional dependency
        run: |
          fresh/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import adata
          for module in pkgutil.walk_packages(adata.__path__, "adata."):
              importlib.import_module(module.name)
          heavy = {"pandas", "scipy", "pyarrow", "anndata"} & set(sys.modules)
          if heavy:
              sys.exit(f"importing adata pulled in {sorted(heavy)}")
          PY

      - name: convert works, with and without click beside typer
        run: |
          mkdir smoke
          cd smoke || exit 1
          printf ',g1,g2,g3\nc1,0,1,2\nc2,3,4,5\nc3,6,7,8\n' > counts.csv
          smoke() {
            rm -rf counts.h5ad counts.zarr back.h5ad recast.h5ad
            ../fresh/bin/adata convert counts.csv -o counts.h5ad
            ../fresh/bin/adata convert counts.h5ad -o counts.zarr --zarr-format 2
            ../fresh/bin/adata convert counts.zarr -o back.h5ad
            ../fresh/bin/adata convert counts.h5ad X -o recast.h5ad --dtype float64
          }
          smoke
          # Another package often brings click; typer's enum must still be
          # told apart from click's.
          uv pip install --python ../fresh/bin/python click
          smoke

      - name: The docs-accuracy suite runs without click
        run: |
          uv pip uninstall --python fresh/bin/python click
          uv pip install --python fresh/bin/python pytest pytest-timeout
          # `!` would not stop a `bash -e` step, hence the explicit exit.
          if fresh/bin/python -c "import click" 2>/dev/null; then
            echo "click is still installed"; exit 1
          fi
          fresh/bin/python -m pytest -q -p no:cacheprovider tests/test_docs_are_accurate.py

  # publish.yml, quay-on-tag.yml and benchmark.yml run only on a tag, so no
  # pull request runs them. actionlint parses every workflow as GitHub will
  # and shellchecks its scripts; zizmor audits them for injection, unpinned
  # actions and excess permissions. Both pinned, so that a new release of
  # either cannot fail a pull request that changed nothing.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: workflow lint

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: false

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: zizmor
        env:
          # Read-only. The online audits ask GitHub whether each pinned commit
          # belongs to its action and whether that version has an advisory.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --format github .github/workflows

  # Builds a store with each pinned anndata release and checks the CLI against
  # it. Split out because it assembles six environments with uv, which needs
  # the network and is far slower than the unit suite.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: anndata 0.8-0.13 compatibility

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      - name: Run compatibility tests
        env:
          # A store that will not build must fail this job, not skip it --
          # otherwise a broken pin leaves it green having checked nothing.
          ADATA_REQUIRE_VERSION_FIXTURES: "1"
        run: |
          uv run pytest -v -W default tests/test_anndata_versions.py \
            -m integration --junitxml=compat-results.xml

      - name: Confirm the compatibility cases actually ran
        if: always()
        run: |
          # Belt and braces: a marker typo or a collection mistake would make
          # the step above pass while executing nothing at all.
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("compat-results.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"{ran} compatibility cases ran ({skipped} skipped of {total})")
          if ran < 150:
              sys.exit(f"expected at least 150 cases to run, got {ran}")
          EOF

  # scanpy and PyTables read the 10x files `convert` writes, and scanpy is
  # the reference for what it reads. Each runs in its own uv environment.
  external-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: 10x h5 against scanpy and PyTables

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --extra dev --frozen

      - name: Run external reader tests
        env:
          # An environment that will not build must fail the job, not skip.
          ADATA_REQUIRE_VERSION_FIXTURES: "1"
        run: |
          uv run pytest -v -W default tests/test_external_readers.py \
            -m integration --junitxml=external-results.xml

      - name: Confirm the cases actually ran
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("external-results.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          ran = int(suite.get("tests", 0)) - int(suite.get("skipped", 0))
          print(f"{ran} external reader cases ran")
          if ran < 8:
              sys.exit(f"expected at least 8 cases to run, got {ran}")
          PY

  # The unit suite once more, on the lowest version of each direct dependency
  # that pyproject.toml allows. The jobs above install the lock, which holds
  # the newest; without this one a floor is a number nobody has installed.
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Every Python the classifiers name: an old release may have wheels
        # for one and not the next.
        python-version: ["3.12", "3.13"]

    name: tests at the dependency floors (py${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.13.1"
          enable-cache: true

      # Resolved apart from uv.lock, so that each direct dependency is at its
      # floor and the rest at their newest, as a pip install would give.
      - name: Install the lowest versions pyproject.toml allows
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip compile pyproject.toml --all-extras --resolution lowest-direct \
            --python-version ${{ matrix.python-version }} -o floors.txt
          uv pip sync floors.txt
          uv pip install --no-deps -e .
          .venv/bin/python .github/scripts/check_floors.py

      # The pickle extra allows pandas 2.2.3, below the dev extra's 3.0, so
      # this runs pandas 3.0; tests/test_external_readers.py converts under
      # 2.2.3 in the external-readers job.
      - name: Run the unit suite
        run: .venv/bin/python -m pytest -v -rs -W default tests/ -m "not integration"
